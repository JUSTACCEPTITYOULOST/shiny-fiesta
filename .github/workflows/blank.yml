name: Upload Local PDF to Release
on: 
   push:
     tags:
       -'v*'

jobs:
  release:
     runs-on: ubuntu-latest
     permissions:
       contents: write
     steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2  
         with:
           filies: main.pdf
           body: "Official book release"
         env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
